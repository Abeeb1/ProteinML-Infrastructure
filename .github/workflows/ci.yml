name: ProteinML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4

      - name: Run validation
        run: python validate.py

      - name: Test Slurm metrics parser
        run: python -m unittest -v test_metrics.py

      - name: Check monitoring script syntax
        run: bash -n submit_and_monitor.sh
